[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "mobilidade-ai"
version = "1.0.0"
description = "Guia de Mobilidade Acessível: fontes oficiais e LLM local"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "numpy>=2,<3", "sentence-transformers>=3.4,<6", "jsonschema>=4.23,<5", "pandas>=2.2,<3", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8", "huggingface-hub>=0.30,<1", "beautifulsoup4>=4.12,<5", "pypdf>=5,<7"]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "playwright>=1.50,<2", "matplotlib>=3.10,<4"]
[project.scripts]
mobilidade = "mobilidade_ai.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/mobilidade_ai"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
